services:
  backend:
    build: ./backend
    init: true
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-osint-hub}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-4}
      TOOL_TIMEOUT: ${TOOL_TIMEOUT:-900}
      MAX_SCANS: ${MAX_SCANS:-100}
      DEFAULT_PHONE_REGION: ${DEFAULT_PHONE_REGION:-IT}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      # Optional: Numverify key for PhoneInfoga (carrier and line type).
      NUMVERIFY_API_KEY: ${NUMVERIFY_API_KEY:-}
    volumes:
      - osint-data:/data
      # Optional: API keys for theHarvester (Shodan, Hunter, SecurityTrails...).
      # Create the file first, otherwise Docker creates a folder in its place.
      # - ./api-keys.yaml:/home/app/.theHarvester/api-keys.yaml:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 10s

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Reachable only from this computer by default.
      # To open it to the local network set BIND_ADDRESS=0.0.0.0 in the .env file
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:80"

volumes:
  osint-data:
