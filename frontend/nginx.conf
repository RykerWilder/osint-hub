server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Docker's internal DNS: the frontend starts even if the backend is not ready yet
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API + live events (SSE): no buffering, long-lived connections.
    # The 512 MB limit leaves room for MAX_UPLOAD_MB (maximum 500); uploads are streamed through, not stored by nginx.
    location /api/ {
        client_max_body_size 512m;
        proxy_request_buffering off;
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Files with a hash in the name: long cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
